[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evyz"
version = "0.2.0"
description = "Personal health intelligence. Learns a daily baseline and explains multi-signal change."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]
api = ["fastapi>=0.115", "uvicorn>=0.32"]

[tool.setuptools.packages.find]
include = ["core*", "integrations*", "apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
